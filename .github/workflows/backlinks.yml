# Module 3 — backlink verification.
#
# Daily, batched. Each run verifies BACKLINK_BATCH links (default 50), oldest
# first, so a list of 500 cycles fully every ten days without hammering the
# referring hosts. Results write straight to Postgres — no file to commit back.

name: Backlinks

on:
  schedule:
    - cron: '0 4 * * *'   # daily 04:00 UTC
  workflow_dispatch:

jobs:
  backlinks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --omit=dev --ignore-scripts

      - name: Verify backlinks
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          BACKLINK_BATCH: ${{ vars.BACKLINK_BATCH }}
        run: node scripts/backlinks.ts
