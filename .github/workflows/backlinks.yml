# Module 3 — backlink verification.
#
# Daily, batched. Each run verifies BACKLINK_BATCH links (default 50), oldest
# first, so a list of 500 cycles fully every ten days without hammering the
# referring hosts.

name: Backlinks

on:
  schedule:
    - cron: '0 4 * * *'   # daily 04:00 UTC
  workflow_dispatch:

concurrency:
  group: sitechecker-db
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backlinks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --omit=dev --ignore-scripts

      - name: Verify backlinks
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          BACKLINK_BATCH: ${{ vars.BACKLINK_BATCH }}
        continue-on-error: true
        run: node scripts/backlinks.ts

      - name: Commit updated database
        run: |
          git config user.name  "sitechecker-bot"
          git config user.email "sitechecker-bot@users.noreply.github.com"
          git add -f .data/sitechecker.db
          git diff --staged --quiet || git commit -m "backlinks: $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push
