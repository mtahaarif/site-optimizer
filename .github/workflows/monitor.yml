# Module 1 — 24/7 uptime monitoring on GitHub Actions.
#
# This is the free path to genuinely round-the-clock checks: your laptop does
# not need to be on, and there is no VPS. Public repos get unlimited Actions
# minutes; private repos get 2,000 minutes/month, and this job uses ~15 seconds
# per run.
#
# Two caveats worth knowing up front:
#   * GitHub throttles scheduled workflows under load. A */5 schedule usually
#     fires every 5-15 minutes, not exactly on the 5. For uptime alerting that
#     is acceptable; for an SLA it is not.
#   * Scheduled workflows are disabled automatically after 60 days with no
#     repository activity. Any commit resets the clock.
#
# The SQLite file is committed back to the repo so history accumulates across
# runs. That is what makes a stateless runner behave like a persistent one.

name: Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Prevent two runs from racing to commit the database.
concurrency:
  group: sitechecker-db
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci --omit=dev --ignore-scripts

      - name: Run monitoring pass
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        # continue-on-error so a DOWN site (exit 1) still commits its history.
        continue-on-error: true
        run: node scripts/monitor.ts

      - name: Commit updated database
        run: |
          git config user.name  "sitechecker-bot"
          git config user.email "sitechecker-bot@users.noreply.github.com"
          git add -f .data/sitechecker.db
          git diff --staged --quiet || git commit -m "monitor: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push
